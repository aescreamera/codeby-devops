namespace: dev

mysql:
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  database: wordpress
  user: wpuser
  password: wppass
  rootPassword: student
  service:
    name: mysql
    port: 3306
  storage:
    size: 2Gi
    storageClass: local-storage
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

wordpress:
  replicaCount: 1
  image:
    repository: wordpress
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: wordpress
    type: NodePort
    port: 80
    nodePort: 30080
  storage:
    size: 2Gi
    storageClass: local-storage
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

ingress:
  enabled: true
  className: nginx
  host: wordpress.local
  path: /
  pathType: Prefix

networkPolicy:
  enabled: true

persistentVolumes:
  mysql:
    name: mysql-pv
    path: /mnt/data/mysql
    node: minikube
  wordpress:
    name: wordpress-pv
    path: /mnt/data/wordpress
    node: minikube-m02
