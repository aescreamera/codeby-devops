apiVersion: apps/v1
kind: Deployment

metadata:
  name: wordpress
  namespace: {{ .Values.namespace  }}

spec:
  replicas: {{ .Values.wordpress.replicaCount  }}
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
      - name: wordpress
        image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
        imagePullPolicy: {{ .Values.wordpress.image.pullPolicy  }}
        ports:
        - containerPort: {{ .Values.wordpress.service.port  }}
        env:
        - name: WORDPRESS_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: wordpress-config
              key: WORDPRESS_DB_HOST
        - name: WORDPRESS_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wordpress-config
              key: WORDPRESS_DB_NAME
        - name: WORDPRESS_DB_USER
          valueFrom:
            configMapKeyRef:
              name: wordpress-config
              key: WORDPRESS_DB_USER
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_DB_PASSWORD
        volumeMounts:
        - name: wordpress-storage
          mountPath: /var/www/html
        resources:
          requests:
            cpu: {{ .Values.wordpress.resources.requests.cpu  }}
            memory: {{ .Values.wordpress.resources.requests.memory }}
          limits:
            cpu: {{ .Values.wordpress.resources.limits.cpu  }}
            memory: {{ .Values.wordpress.resources.limits.memory  }}
      volumes:
      - name: wordpress-storage
        persistentVolumeClaim:
          claimName: wordpress-pvc

