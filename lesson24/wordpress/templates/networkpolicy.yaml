{{- if .Values.networkPolicy.enabled  }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: mysql-network-policy
  namespace: {{ .Values.namespace  }}

spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress
      ports:
        - protocol: TCP
          port: {{ .Values.mysql.service.port  }}
{{- end }}
