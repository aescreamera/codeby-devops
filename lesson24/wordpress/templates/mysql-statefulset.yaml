apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql
  namespace: {{ .Values.namespace  }}

spec:
  serviceName: {{ .Values.mysql.service.name  }}
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: "{{ .Values.mysql.image.repository  }}:{{ .Values.mysql.image.tag  }}"
        imagePullPolicy: {{ .Values.mysql.image.pullPolicy  }}
        ports:
        - containerPort: {{ .Values.mysql.service.port  }}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: wordpress-config
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: wordpress-config
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: MYSQL_PASSWORD
        resources:
          requests:
            cpu: {{ .Values.mysql.resources.requests.cpu  }}
            memory: {{ .Values.mysql.resources.requests.memory  }}
          limits:
            cpu: {{ .Values.mysql.resources.limits.cpu  }}
            memory: {{ .Values.mysql.resources.limits.memory  }}
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
